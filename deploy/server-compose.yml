# Sunucu deploy — tum config imaj icinde (env.defaults.ts). Ek env gerekmez.
services:
  kutuphane-api:
    image: ghcr.io/selcuk-dijital/kutuphane-backend:latest
    container_name: kutuphane-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - default
      - university-shared

networks:
  university-shared:
    name: university_university-network
    external: true
